questions:
- id: q001
  type: multiple_choice
  question: |
    What is the primary purpose of Microsoft Foundry?
  options:
    - text: To provide only machine learning model training
      is_correct: false
    - text: To serve as a unified platform for building, deploying, and governing AI apps and agents
      is_correct: true
    - text: To replace Azure Machine Learning entirely
      is_correct: false
    - text: To focus solely on computer vision workloads
      is_correct: false
  explanation: |
    Correct: Foundry is designed as the enterprise AI app and agent factory, unifying models, tools, agents, and governance distinguishing it from narrower services.

- id: q002
  type: multiple_choice
  question: |
    Which of the following is a key evolution in Foundry compared to previous Azure AI tools?
  options:
    - text: Removal of model catalog
      is_correct: false
    - text: Consolidation of services into a single portal with built-in agent service
      is_correct: true
    - text: Exclusive support for open-source models only
      is_correct: false
    - text: Elimination of SDK support
      is_correct: false
  explanation: |
    Correct: Foundry consolidates capabilities and introduces robust Agent Service for production agents.

- id: q003
  type: multiple_choice
  question: |
    In the Foundry portal, what tab would you primarily use to create and test agents?
  options:
    - text: Operate
      is_correct: false
    - text: Discover
      is_correct: false
    - text: Build
      is_correct: true
    - text: Docs
      is_correct: false
  explanation: |
    Correct: The Build tab provides access to playgrounds and agent creation tools.

- id: q004
  type: multiple_choice
  question: |
    What authentication method is commonly used with the Foundry SDK in Python examples?
  options:
    - text: Hardcoded API keys only
      is_correct: false
    - text: DefaultAzureCredential
      is_correct: true
    - text: Shared access signatures exclusively
      is_correct: false
    - text: No authentication required
      is_correct: false
  explanation: |
    Correct: DefaultAzureCredential supports managed identities and seamless Azure AD auth for secure access.

- id: q005
  type: multiple_choice
  question: |
    Which feature of Microsoft Foundry primarily helps prevent hallucinations in generative AI responses?
  options:
    - text: Content Safety filters only
      is_correct: false
    - text: Knowledge grounding with RAG and Azure AI Search
      is_correct: true
    - text: Temperature settings in prompts
      is_correct: false
    - text: Serverless endpoints
      is_correct: false
  explanation: |
    Correct: Knowledge grounding via RAG retrieves relevant enterprise data before generation, directly addressing hallucinations unlike general safety tools or parameters.

- id: q006
  type: multiple_choice
  question: |
    What is the main benefit of using Projects within a Foundry Hub?
  options:
    - text: They replace the need for Azure resource groups
      is_correct: false
    - text: They provide isolation for experiments while sharing hub-level resources and governance
      is_correct: true
    - text: They are limited to single-user access
      is_correct: false
    - text: They only store deployed models
      is_correct: false
  explanation: |
    Correct: Projects enable team collaboration with resource isolation under shared hub governance, promoting organized development.

- id: q007
  type: multiple_choice
  question: |
    In the Foundry portal, which tab is primarily used for monitoring agent performance, costs, and alerts?
  options:
    - text: Discover
      is_correct: false
    - text: Build
      is_correct: false
    - text: Operate
      is_correct: true
    - text: Docs
      is_correct: false
  explanation: |
    Correct: The Operate tab focuses on observability, metrics, evaluations, and operational management.

- id: q008
  type: multiple_choice
  question: |
    Which authentication approach is recommended for the Foundry SDK in production scenarios?
  options:
    - text: Hardcoded API keys
      is_correct: false
    - text: DefaultAzureCredential with managed identities
      is_correct: true
    - text: Shared access signatures for all calls
      is_correct: false
    - text: Anonymous access
      is_correct: false
  explanation: |
    Correct: DefaultAzureCredential leverages Entra ID and managed identities for secure, seamless enterprise authentication.

- id: q009
  type: multiple_choice
  question: |
    What distinguishes Prompt Agents from Hosted Agents in Foundry?
  options:
    - text: Prompt Agents require custom runtime code
      is_correct: false
    - text: Prompt Agents are fully managed by Foundry with no runtime maintenance
      is_correct: true
    - text: Hosted Agents cannot use tools
      is_correct: false
    - text: Prompt Agents are limited to text-only models
      is_correct: false
  explanation: |
    Correct: Prompt Agents are authored in the portal or SDK and run entirely by Foundry, simplifying development.

- id: q010
  type: multiple_choice
  question: |
    When deploying a model in the Model Catalog, what configuration parameter controls the creativity of outputs?
  options:
    - text: Max tokens
      is_correct: false
    - text: Temperature
      is_correct: false
    - text: Top-p (nucleus sampling)
      is_correct: false
    - text: Both b and c
      is_correct: true
  explanation: |
    Correct: Temperature and top-p both influence randomness and creativity; lower values yield more deterministic responses.

- id: q011
  type: multiple_choice
  question: |
    Which Azure service integrates natively with Foundry for vector-based knowledge retrieval?
  options:
    - text: Azure Blob Storage
      is_correct: false
    - text: Azure AI Search
      is_correct: true
    - text: Azure Functions
      is_correct: false
    - text: Azure Virtual Machines
      is_correct: false
  explanation: |
    Correct: Azure AI Search powers vector indexes for effective RAG grounding in agents and apps.

- id: q012
  type: multiple_choice
  question: |
    What is the primary purpose of the Foundry SDK's chat.completions.create method?
  options:
    - text: To deploy new models
      is_correct: false
    - text: To send inference requests to deployed models or agents
      is_correct: true
    - text: To create new projects
      is_correct: false
    - text: To monitor costs only
      is_correct: false
  explanation: |
    Correct: It handles chat interactions, supporting system/user messages, tools, and streaming.

- id: q013
  type: multiple_choice
  question: |
    Enterprise governance in Foundry includes which of the following?
  options:
    - text: Policy enforcement, audit logs, and private networking
      is_correct: true
    - text: Only model catalog browsing
      is_correct: false
    - text: Public internet access by default
      is_correct: false
    - text: Elimination of RBAC requirements
      is_correct: false
  explanation: |
    Correct: Built-in features ensure compliance, security, and traceability for production use.

- id: q014
  type: multiple_choice
  question: |
    What should you do first when troubleshooting authentication errors in the Foundry SDK?
  options:
    - text: Increase temperature
      is_correct: false
    - text: Verify DefaultAzureCredential and Entra ID permissions
      is_correct: true
    - text: Change the model
      is_correct: false
    - text: Disable tracing
      is_correct: false
  explanation: |
    Correct: Most auth issues stem from credential configuration or missing roles.

- id: q015
  type: multiple_choice
  question: |
    Which model type in the Foundry catalog is best for multimodal tasks involving images and text?
  options:
    - text: Text-only foundational models
      is_correct: false
    - text: Multimodal models like GPT-4o
      is_correct: true
    - text: Open-source text models only
      is_correct: false
    - text: Task-specific speech models
      is_correct: false
  explanation: |
    Correct: Multimodal models handle combined inputs like vision + text prompts.

- id: q016
  type: multiple_choice
  question: |
    In agent development, what do Tools (via MCP) enable agents to do?
  options:
    - text: Only generate text
      is_correct: false
    - text: Call external APIs, databases, or services to act on the world
      is_correct: true
    - text: Replace the need for prompts
      is_correct: false
    - text: Limit observability
      is_correct: false
  explanation: |
    Correct: Tools extend agent capabilities for real actions beyond generation.

- id: q017
  type: multiple_choice
  question: |
    What is a key advantage of serverless endpoints in Foundry model deployment?
  options:
    - text: They require manual scaling
      is_correct: false
    - text: Automatic scaling and pay-per-use pricing
      is_correct: true
    - text: Limited to open-source models
      is_correct: false
    - text: No integration with playground
      is_correct: false
  explanation: |
    Correct: Serverless options simplify operations with auto-scaling.

- id: q018
  type: multiple_choice
  question: |
    How does observability in Foundry help with cost management?
  options:
    - text: By ignoring token usage
      is_correct: false
    - text: Through detailed metrics on token consumption, latency, and alerts
      is_correct: true
    - text: Only via manual logs
      is_correct: false
    - text: By disabling evaluations
      is_correct: false
  explanation: |
    Correct: Comprehensive monitoring optimizes spend and performance.

- id: q019
  type: multiple_choice
  question: |
    When creating a lightweight chat client application, which SDK component is essential?
  options:
    - text: Only the portal UI
      is_correct: false
    - text: FoundryClient with proper endpoint and credential
      is_correct: true
    - text: Azure CLI exclusively
      is_correct: false
    - text: PowerShell scripts
      is_correct: false
  explanation: |
    Correct: The client enables programmatic interaction from custom apps.

- id: q020
  type: multiple_choice
  question: |
    What role do Evaluations play in Foundry agent development?
  options:
    - text: They replace testing in the playground
      is_correct: false
    - text: They benchmark performance on relevance, safety, and accuracy
      is_correct: true
    - text: They are only for models, not agents
      is_correct: false
    - text: They increase costs without benefit
      is_correct: false
  explanation: |
    Correct: Evaluations drive iterative improvement with quantitative metrics.

