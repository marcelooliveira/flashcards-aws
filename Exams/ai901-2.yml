questions:
- id: q001
  type: multiple_choice
  question: |
    Which AI workload is primarily responsible for creating new text, images, or code based on user prompts?
  options:
    - text: Text Analysis
      is_correct: false
    - text: Computer Vision
      is_correct: false
    - text: Generative AI
      is_correct: true
    - text: Information Extraction
      is_correct: false
  explanation: |
    Correct: Generative AI focuses on creation of novel content, unlike analysis or extraction workloads. This tests core distinction.

- id: q002
  type: multiple_choice
  question: |
    What does agentic AI primarily enable beyond standard generative outputs?
  options:
    - text: Simple keyword search
      is_correct: false
    - text: Autonomous planning, tool use, and multi-step task execution
      is_correct: true
    - text: Image classification only
      is_correct: false
    - text: Speech synthesis
      is_correct: false
  explanation: |
    Correct: Agentic systems reason and act toward goals using tools, distinguishing them from passive generation.

- id: q003
  type: multiple_choice
  question: |
    In text analysis, Named Entity Recognition (NER) is used to:
  options:
    - text: Generate images
      is_correct: false
    - text: Identify people, organizations, dates in text
      is_correct: true
    - text: Convert speech to text
      is_correct: false
    - text: Extract tables from videos
      is_correct: false
  explanation: |
    Correct: NER is a key NLP technique for entity detection, central to text workloads.

