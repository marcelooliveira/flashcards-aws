questions:
- id: q001
  type: multiple_choice
  question: |
    What is the primary purpose of a system prompt in generative AI?
  options:
    - text: To provide the specific user query
      is_correct: false
    - text: To define the model's role, behavior, and guidelines
      is_correct: true
    - text: To handle token limits only
      is_correct: false
    - text: To store conversation history
      is_correct: false
  explanation: |
    Correct: System prompts set the foundational instructions for the model's personality and constraints, unlike user prompts which deliver the immediate task. This ensures consistent, reliable behavior across interactions.

- id: q002
  type: multiple_choice
  question: |
    Which prompting technique encourages the model to reason step by step?
  options:
    - text: Few-shot prompting
      is_correct: false
    - text: Chain-of-Thought (CoT)
      is_correct: true
    - text: Zero-shot prompting
      is_correct: false
    - text: Role-playing only
      is_correct: false
  explanation: |
    Correct: CoT explicitly instructs the model to break down reasoning, improving accuracy on complex tasks compared to simpler techniques.

- id: q003
  type: multiple_choice
  question: |
    In Microsoft Foundry, where would you primarily test and iterate on prompts before coding?
  options:
    - text: Azure Portal only
      is_correct: false
    - text: The Playground in the Foundry portal
      is_correct: true
    - text: PowerShell terminal
      is_correct: false
    - text: Microsoft Word
      is_correct: false
  explanation: |
    Correct: The Playground provides an interactive environment for experimentation, parameter tuning, and comparison ideal for rapid iteration.

- id: q004
  type: multiple_choice
  question: |
    What SDK is recommended for building lightweight chat applications in Foundry?
  options:
    - text: Only REST API
      is_correct: false
    - text: Azure AI Projects SDK (Python, .NET, etc.)
      is_correct: true
    - text: Azure CLI exclusively
      is_correct: false
    - text: Microsoft Graph only
      is_correct: false
  explanation: |
    Correct: The AI Projects SDK simplifies authentication, chat completions, and agent interactions with native language support.

- id: q005
  type: multiple_choice
  question: |
    Which agent type in Foundry Agent Service is fully managed via prompts and tools in the portal?
  options:
    - text: Hosted code-based agents only
      is_correct: false
    - text: Prompt Agents
      is_correct: true
    - text: Legacy Azure Functions
      is_correct: false
    - text: Static web apps
      is_correct: false
  explanation: |
    Correct: Prompt Agents allow quick creation without writing deployment code, managed entirely by the platform.

- id: q006
  type: multiple_choice
  question: |
    In prompt engineering, what does "few-shot" prompting primarily involve?
  options:
    - text: Providing no examples
      is_correct: false
    - text: Giving the model 2-5 input-output examples
      is_correct: true
    - text: Only adjusting temperature settings
      is_correct: false
    - text: Using only system prompts without user input
      is_correct: false
  explanation: |
    Correct: Few-shot prompting supplies examples to guide the model's output format and style, significantly improving consistency over zero-shot approaches.

- id: q007
  type: multiple_choice
  question: |
    Which parameter in Foundry model deployment controls the creativity level of responses?
  options:
    - text: Max tokens
      is_correct: false
    - text: Temperature
      is_correct: true
    - text: Top-p only
      is_correct: false
    - text: Presence penalty
      is_correct: false
  explanation: |
    Correct: Temperature adjusts randomness; low values produce focused, deterministic outputs; higher values increase creativity.

- id: q008
  type: multiple_choice
  question: |
    What is the main benefit of grounding in generative AI applications?
  options:
    - text: Increasing model size
      is_correct: false
    - text: Reducing hallucinations by providing relevant context or retrieved data
      is_correct: true
    - text: Only improving speed
      is_correct: false
    - text: Removing the need for prompts
      is_correct: false
  explanation: |
    Correct: Grounding (often via RAG) supplies factual context, leading to more accurate and trustworthy responses.

- id: q009
  type: multiple_choice
  question: |
    In the Foundry portal, what feature allows side-by-side comparison of different models?
  options:
    - text: Only the Monitor dashboard
      is_correct: false
    - text: The Playground
      is_correct: true
    - text: Azure CLI commands
      is_correct: false
    - text: Power BI integration
      is_correct: false
  explanation: |
    Correct: The Playground supports testing, parameter tuning, and direct model comparison for optimal selection.

- id: q010
  type: multiple_choice
  question: |
    Which authentication method is recommended for production Foundry SDK applications?
  options:
    - text: Hardcoded API keys
      is_correct: false
    - text: Managed identities with DefaultAzureCredential
      is_correct: true
    - text: Shared access signatures only
      is_correct: false
    - text: Basic username/password
      is_correct: false
  explanation: |
    Correct: Managed identities provide secure, passwordless authentication aligned with Azure best practices.

- id: q011
  type: multiple_choice
  question: |
    What is a key characteristic of a single-agent solution in Foundry?
  options:
    - text: It only handles static queries without tools
      is_correct: false
    - text: It reasons, uses tools, maintains context, and acts autonomously toward a goal
      is_correct: true
    - text: It requires manual deployment on VMs
      is_correct: false
    - text: It cannot integrate with external APIs
      is_correct: false
  explanation: |
    Correct: Agents follow a perceive-reason-act loop, leveraging tools and memory for complex task completion.

- id: q012
  type: multiple_choice
  question: |
    When building client applications for agents, which SDK method is used to create and process a run?
  options:
    - text: project_client.inference.chat.completions.create
      is_correct: false
    - text: project_client.agents.runs.create_and_process
      is_correct: true
    - text: Only REST API calls
      is_correct: false
    - text: Azure Functions trigger
      is_correct: false
  explanation: |
    Correct: This method handles thread creation, message submission, and run processing in one streamlined operation.

- id: q013
  type: multiple_choice
  question: |
    What is the purpose of human-in-the-loop in agentic workflows?
  options:
    - text: To replace AI decision-making entirely
      is_correct: false
    - text: To provide oversight and intervention in high-stakes or uncertain scenarios
      is_correct: true
    - text: To increase token consumption
      is_correct: false
    - text: Only for testing in the Playground
      is_correct: false
  explanation: |
    Correct: It ensures safety, compliance, and quality by combining AI efficiency with human judgment.

