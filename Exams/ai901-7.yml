- id: q024
  type: multiple_choice
  question: |
    Which Python code snippet correctly initiates document analysis? (Conceptual)
  options:
    - text: "client.chat.completions.create(...)"
      is_correct: false
    - text: "client.analyze_document(document=file, analyzer_id=\"custom-analyzer\")"
      is_correct: true
    - text: "client.generate_image(...)"
      is_correct: false
    - text: "client.transcribe_audio(...) only"
      is_correct: false
  explanation: |
    Correct: The analyze_document method (or equivalent) is used for Content Understanding tasks.
    Incorrect:
    - chat.completions.create is for chat models.
    - generate_image is for image generation.
    - transcribe_audio is only for audio transcription.

- id: q025
