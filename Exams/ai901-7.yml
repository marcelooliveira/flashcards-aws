questions:
- id: q001
  type: multiple_choice
  question: |
    A company needs to extract structured data (invoice numbers, dates, amounts) from thousands of PDF invoices. Which Azure AI service in Foundry should they use?
  options:
    - text: Azure AI Document Intelligence (formerly Form Recognizer) via Content Understanding
      is_correct: true
    - text: Azure AI Vision for general image analysis only
      is_correct: false
    - text: Azure AI Speech for audio transcription
      is_correct: false
    - text: Azure AI Language for sentiment analysis
      is_correct: false
  explanation: |
    Correct: Azure AI Document Intelligence (accessed through Content Understanding in Foundry) is specifically designed to extract structured information from documents and forms, including invoices, receipts, and custom documents.
    Incorrect:
    - General image analysis doesn't understand document structure.
    - Speech transcription is for audio, not document extraction.
    - Sentiment analysis examines emotions in text, not extracting structured data.
  diagram: |
    graph TD
      A[PDF Invoices] --> B[Azure AI Document Intelligence]
      B --> C[Layout Analysis]
      C --> D[Field Extraction]
      D --> E[Invoice Number]
      D --> F[Date]
      D --> G[Amount]
      E --> H[Structured Data Output]
      F --> H
      G --> H

- id: q002
  type: multiple_choice
  question: |
    What is the primary role of Azure Content Understanding in Microsoft Foundry?
  options:
    - text: Image generation only
      is_correct: false
    - text: Extracting structured information from multimodal unstructured content
      is_correct: true
    - text: Speech synthesis
      is_correct: false
    - text: Model training from scratch
      is_correct: false
  explanation: |
    Correct: Content Understanding is designed for processing documents, images, audio, and video into structured outputs using schemas and analyzers. Options a, c, and d belong to other workloads.
    Incorrect:
    - Image generation is a separate workload.
    - Speech synthesis is different from content extraction.
    - Content Understanding uses existing models, not training from scratch.

- id: q003
  type: multiple_choice
  question: |
    Which feature ensures outputs are anchored to source material?
  options:
    - text: Hallucination mode
      is_correct: false
    - text: Grounding
      is_correct: true
    - text: Token limiting
      is_correct: false
    - text: Temperature setting
      is_correct: false
  explanation: |
    Correct: Grounding forces the model to base extractions on actual input content, reducing errors core to reliable information extraction.
    Incorrect:
    - Hallucination mode would increase inaccuracy.
    - Token limiting controls output length, not accuracy.
    - Temperature setting affects response randomness, not grounding.

- id: q004
  type: multiple_choice
  question: |
    Which input modalities does Azure Content Understanding support in Foundry?
  options:
    - text: Text files only
      is_correct: false
    - text: Documents, images, audio, and video
      is_correct: true
    - text: Code repositories
      is_correct: false
    - text: Structured databases exclusively
      is_correct: false
  explanation: |
    Correct: Content Understanding is multimodal and handles documents/forms, images, audio, and video. The other options are narrower or unrelated to its core capabilities.
    Incorrect:
    - Text-only would eliminate image and audio capabilities.
    - Code repositories are not part of Content Understanding.
    - Databases are already structured data, not the focus.

- id: q005
  type: multiple_choice
  question: |
    What is the main purpose of defining a custom schema when building an analyzer?
  options:
    - text: To increase processing speed only
      is_correct: false
    - text: To specify the exact fields and structure for extraction with grounding
      is_correct: true
    - text: To train a new foundational model
      is_correct: false
    - text: To generate images from content
      is_correct: false
  explanation: |
    Correct: Schemas guide the LLM and deterministic models to extract precise, structured fields (e.g., InvoiceNumber, Total) while maintaining grounding to the source.
    Incorrect:
    - Schemas don't directly affect speed.
    - Schemas don't train new models.
    - Image generation is unrelated to schema definition.

- id: q006
  type: multiple_choice
  question: |
    In a high-volume invoice processing scenario, which approach would most improve accuracy and reduce manual review?
  options:
    - text: Using only generic vision models
      is_correct: false
    - text: Hybrid use of prebuilt analyzers + custom schema-driven extraction with confidence thresholds
      is_correct: true
    - text: Manual data entry
      is_correct: false
    - text: Speech synthesis on invoices
      is_correct: false
  explanation: |
    Correct: Prebuilts handle common layouts while custom schemas add domain-specific precision and grounding, directly addressing automation needs tested in AI-901.
    Incorrect:
    - Generic models lack document-specific understanding.
    - Manual entry defeats automation.
    - Speech synthesis is irrelevant to invoice processing.

- id: q007
  type: multiple_choice
  question: |
    What does grounding mean in the context of Content Understanding?
  options:
    - text: Connecting the model to the internet
      is_correct: false
    - text: Anchoring extracted outputs to specific locations in the source content
      is_correct: true
    - text: Reducing model size
      is_correct: false
    - text: Adding decorative visuals
      is_correct: false
  explanation: |
    Correct: Grounding minimizes hallucinations by linking results (e.g., a extracted clause) back to exact source text, image region, or timestamp.
    Incorrect:
    - Internet connection is not grounding.
    - Model size reduction is unrelated.
    - Decorative visuals don't relate to grounding.

- id: q008
  type: multiple_choice
  question: |
    Which SDK is primarily used to interact with Content Understanding analyzers programmatically?
  options:
    - text: Azure OpenAI SDK only
      is_correct: false
    - text: azure.ai.contentunderstanding
      is_correct: true
    - text: Azure Storage SDK
      is_correct: false
    - text: PowerShell cmdlets exclusively
      is_correct: false
  explanation: |
    Correct: The dedicated ContentUnderstandingClient in the Azure SDK allows uploading content and retrieving structured JSON results.
    Incorrect:
    - OpenAI SDK is for different workloads.
    - Storage SDK manages blob storage, not content analysis.
    - PowerShell is one option but not the primary programmatic interface.

- id: q009
  type: multiple_choice
  question: |
    For extracting action items from a recorded team meeting, which capability is most relevant?
  options:
    - text: Image generation
      is_correct: false
    - text: Audio transcription + schema-based entity and action extraction with speaker diarization
      is_correct: true
    - text: Pure document OCR
      is_correct: false
    - text: Model training
      is_correct: false
  explanation: |
    Correct: Audio/video workflows support transcription, diarization, and structured field extraction for insights like decisions and tasks.
    Incorrect:
    - Image generation doesn't extract meeting data.
    - OCR is for documents, not audio.
    - Model training is not necessary for extraction.

- id: q010
  type: multiple_choice
  question: |
    What Responsible AI principle is most critical when processing sensitive medical forms?
  options:
    - text: Creativity only
      is_correct: false
    - text: Privacy and security (with compliance, encryption, and access controls)
      is_correct: true
    - text: High temperature settings
      is_correct: false
    - text: Maximal output length
      is_correct: false
  explanation: |
    Correct: Privacy ensures protected health information is handled compliantly, a key governance aspect in enterprise AI.
    Incorrect:
    - Creativity is not relevant to healthcare data.
    - Temperature settings don't address privacy.
    - Output length doesn't ensure compliance.

- id: q011
  type: multiple_choice
  question: |
    How can you handle low-confidence extractions in a production application?
  options:
    - text: Ignore them completely
      is_correct: false
    - text: Implement human-in-the-loop review for fields below a confidence threshold
      is_correct: true
    - text: Increase temperature
      is_correct: false
    - text: Delete the source file
      is_correct: false
  explanation: |
    Correct: Human oversight combined with confidence scores ensures reliability and safety.
    Incorrect:
    - Ignoring them risks data quality.
    - Increasing temperature increases randomness, not accuracy.
    - Deleting files doesn't solve the problem.

- id: q012
  type: multiple_choice
  question: |
    Which prebuilt analyzer would you start with for standard receipts?
  options:
    - text: Custom vision only
      is_correct: false
    - text: Prebuilt Receipt analyzer in Content Understanding
      is_correct: true
    - text: Speech service
      is_correct: false
    - text: Agent builder
      is_correct: false
  explanation: |
    Correct: Prebuilt analyzers provide high out-of-the-box accuracy for common document types before customization.
    Incorrect:
    - Custom vision is for image classification, not receipt extraction.
    - Speech service is for audio.
    - Agent builder handles workflows, not extraction.

- id: q013
  type: multiple_choice
  question: |
    What is a key advantage of using Content Understanding over pure custom LLMs for extraction?
  options:
    - text: Lower cost always
      is_correct: false
    - text: Strong grounding and hybrid deterministic + generative accuracy
      is_correct: true
    - text: No need for schemas
      is_correct: false
    - text: Image generation focus
      is_correct: false
  explanation: |
    Correct: The hybrid approach reduces hallucinations while supporting structured outputs.
    Incorrect:
    - Cost varies by usage patterns.
    - Schemas are essential for quality extraction.
    - Image generation is not the focus.

- id: q014
  type: multiple_choice
  question: |
    In the Foundry portal, where do you create and manage analyzers?
  options:
    - text: Within a Foundry project under Content Understanding tools
      is_correct: true
    - text: In Azure Functions only
      is_correct: false
    - text: Power BI workspace
      is_correct: false
    - text: Azure DevOps boards
      is_correct: false
  explanation: |
    Correct: Analyzers are built and tested directly in the project context of the Foundry portal.
    Incorrect:
    - Azure Functions are for serverless compute, not analyzer creation.
    - Power BI is for analytics.
    - DevOps boards are for project management.

- id: q015
  type: multiple_choice
  question: |
    For an image of a product label, what schema fields might you define?
  options:
