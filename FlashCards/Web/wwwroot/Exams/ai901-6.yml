    - text: Disable multimodal features
      is_correct: false
    - text: Use only legacy non-Azure tools
      is_correct: false
  explanation: |
    Correct: This creates end-to-end solutions (describe image -> read aloud) for visually impaired users.
    Incorrect: Other options do not create comprehensive accessibility solutions.

