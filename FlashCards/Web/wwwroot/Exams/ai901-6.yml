  question: |
    How can you create visual consistency across generated images for a marketing campaign?
  options:
    - text: Use the same seed value and detailed reference prompts or image variations
      is_correct: true
    - text: Randomize all parameters each time
      is_correct: false
    - text: Avoid using the playground
      is_correct: false
    - text: Switch models mid-campaign
      is_correct: false
  explanation: |
    Correct: Consistent prompting and variation features maintain brand identity.
    Incorrect: Other options would produce inconsistent results.

- id: q014
  type: multiple_choice
  question: |
    What is a common pitfall when interpreting complex scenes with multimodal models?
  options:
    - text: Providing too much contextual text in the prompt
      is_correct: false
    - text: Hallucinations or misinterpretations; mitigate with grounding and follow-up prompts
      is_correct: true
    - text: Using only single-word prompts
      is_correct: false
    - text: Never testing with real images
      is_correct: false
  explanation: |
    Correct: Models can invent details; best practices include clear instructions and verification.
    Incorrect: Other options do not address the hallucination challenge.

