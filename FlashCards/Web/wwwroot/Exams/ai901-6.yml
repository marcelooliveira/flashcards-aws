questions:
- id: q001
  type: multiple_choice
  question: |
    What is the primary way to interpret visual input in prompts within Microsoft Foundry?
  options:
    - text: Using only text-based models
      is_correct: false
    - text: By deploying a multimodal model that accepts both text and image data
      is_correct: true
    - text: Through separate OCR APIs only
      is_correct: false
    - text: Via legacy Azure Machine Learning pipelines
      is_correct: false
  explanation: |
    Correct: Multimodal models in Foundry (e.g., GPT-4o variants) natively process image URLs alongside text prompts for integrated reasoning, as per the exam skills measured for vision implementation.
    Incorrect: Options A, C, and D do not capture the unified multimodal approach emphasized in Foundry.

- id: q002
  type: multiple_choice
  question: |
    Which Foundry feature allows creating new visual outputs from text descriptions?
  options:
    - text: Azure Speech synthesis
      is_correct: false
    - text: Generative image models like DALL-E or Flux in the Images Playground
      is_correct: true
    - text: Text-only RAG
      is_correct: false
    - text: Content Understanding for documents only
      is_correct: false
  explanation: |
    Correct: Generative models in Foundry explicitly support text-to-image creation, editing, and variations, aligning directly with skill L147.
    Incorrect: Other options do not support text-to-image generation capabilities.

- id: q003
  type: multiple_choice
  question: |
    Which type of model in Microsoft Foundry is best suited for interpreting visual input alongside text prompts?
  options:
    - text: Text-only LLMs like GPT-3.5
      is_correct: false
    - text: Multimodal models such as GPT-4o variants or MAI-Vision models
      is_correct: true
    - text: Speech-only synthesis models
      is_correct: false
    - text: Traditional rule-based OCR engines
      is_correct: false
  explanation: |
    Correct: Multimodal models natively accept image URLs or data with text, enabling integrated reasoning (visual question answering, dense captions). This is a core Foundry implementation skill.
    Incorrect: Other options lack multimodal support.

- id: q004
  type: multiple_choice
  question: |
    In Foundry's image generation workflow, what parameter controls the number of images returned in a single request?
  options:
    - text: Temperature
      is_correct: false
    - text: n (number of images)
      is_correct: true
    - text: Max tokens
      is_correct: false
    - text: Top-p
      is_correct: false
  explanation: |
    Correct: The SDK parameter n specifies how many image variations to generate (e.g., n=4). This is specific to generative image models like DALL-E or MAI-Image series in Foundry.
    Incorrect: Other parameters control different aspects of model behavior.

- id: q005
  type: multiple_choice
  question: |
    What is the primary benefit of using generative models for image editing (inpainting) in Foundry?
  options:
    - text: Completely replacing all objects in an image automatically
      is_correct: false
    - text: Selectively modifying or filling specific regions while preserving the rest
      is_correct: true
    - text: Only changing text within the image
      is_correct: false
    - text: Reducing image resolution for faster processing
      is_correct: false
  explanation: |
    Correct: Inpainting allows targeted edits (e.g., remove an object and fill realistically), enabling creative and practical applications while maintaining context.
    Incorrect: Other options do not describe the inpainting capability accurately.

- id: q006
  type: multiple_choice
  question: |
    When building a lightweight vision application in Foundry, which SDK is most commonly used for Python clients?
  options:
