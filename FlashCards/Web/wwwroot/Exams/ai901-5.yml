      is_correct: false
    - text: Multimodal model
      is_correct: true
    - text: Speech-to-Text only
      is_correct: false
    - text: Translator service
      is_correct: false
  explanation: |
    Correct: Multimodal models in Foundry unify voice, text, and vision processing for richer interactions, unlike siloed services.

- id: q008
  type: multiple_choice
  question: |
    Which best practice ensures ethical use of voice data in Foundry speech applications?
  options:
    - text: Store all recordings indefinitely
      is_correct: false
    - text: Obtain explicit user consent and implement privacy controls
      is_correct: true
    - text: Ignore regional data laws
      is_correct: false
    - text: Use public datasets without review
      is_correct: false
  explanation: |
    Correct: Consent and privacy (e.g., GDPR compliance, anonymization) align with Responsible AI principles covered in the exam.

- id: q009
  type: multiple_choice
  question: |
    In the Speech SDK for Foundry, what configuration enables real-time transcription from a microphone?
  options:
    - text: Batch audio file input only
      is_correct: false
    - text: AudioConfig with default microphone
      is_correct: true
    - text: Image input configuration
      is_correct: false
    - text: Text-to-speech synthesizer only
      is_correct: false
  explanation: |
    Correct: AudioConfig(use_default_microphone=True) combined with SpeechRecognizer supports live streaming input.

