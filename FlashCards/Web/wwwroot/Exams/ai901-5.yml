questions:
- id: q001
  type: multiple_choice
  question: |
    Which Azure service in Foundry Tools provides core NLP features like sentiment analysis, entity recognition, and key phrase extraction?
  options:
    - text: Azure Vision
      is_correct: false
    - text: Azure Speech
      is_correct: false
    - text: Azure Language
      is_correct: true
    - text: Azure Translator
      is_correct: false
  explanation: |
    Correct: Azure Language in Foundry Tools provides core NLP features like sentiment analysis, entity recognition, and summarization, directly matching the lightweight text analysis requirements for AI-901.

- id: q002
  type: multiple_choice
  question: |
    Which capability allows a multimodal model in Foundry to process both spoken input and visual context in one interaction?
  options:
    - text: Speech-to-Text only
      is_correct: false
    - text: Text-to-Speech only
      is_correct: false
    - text: Unified multimodal understanding
      is_correct: true
    - text: Batch translation
      is_correct: false
  explanation: |
    Correct: Multimodal models handle voice, text, and vision natively, unlike siloed services. This is key for responding to spoken prompts with visual input.

- id: q003
  type: multiple_choice
  question: |
    In Azure Speech in Foundry Tools, what feature identifies different speakers in a multi-person conversation?
  options:
    - text: Neural TTS
      is_correct: false
    - text: Speaker diarization
      is_correct: true
    - text: Key phrase extraction
      is_correct: false
    - text: Sentiment scoring
      is_correct: false
  explanation: |
    Correct: Speaker diarization is a core Speech capability for distinguishing speakers, essential for accurate transcription in group settings.

- id: q004
  type: multiple_choice
  question: |
    Which Azure service in Foundry Tools is primarily used for performing opinion mining and key phrase extraction on customer feedback?
  options:
    - text: Azure Speech
      is_correct: false
    - text: Azure Vision
      is_correct: false
    - text: Azure Language
      is_correct: true
    - text: Azure Content Understanding
      is_correct: false
  explanation: |
    Correct: Azure Language provides advanced NLP features including opinion mining (aspect-based sentiment) and key phrase extraction, making it ideal for text analysis applications in Foundry. Options A and B focus on audio/visual, while D is for structured extraction from documents.

- id: q005
  type: multiple_choice
  question: |
    In a Foundry lightweight application, what SDK method would you use to analyze sentiment on a batch of documents?
  options:
    - text: client.recognize_once()
      is_correct: false
    - text: client.synthesize_speech()
      is_correct: false
    - text: client.analyze_sentiment(documents)
      is_correct: true
    - text: client.detect_objects()
      is_correct: false
  explanation: |
    Correct: The analyze_sentiment method from the TextAnalysisClient in Azure Language SDK handles batch sentiment analysis. The other options belong to Speech or Vision SDKs.

- id: q006
  type: multiple_choice
  question: |
    What feature of Azure Speech in Foundry Tools allows identification of who spoke which parts in a multi-speaker meeting recording?
  options:
    - text: Neural voice synthesis
      is_correct: false
    - text: Real-time translation
      is_correct: false
    - text: Speaker diarization
      is_correct: true
    - text: Language detection
      is_correct: false
  explanation: |
    Correct: Speaker diarization segments audio by speaker, crucial for accurate transcription in group scenarios. The others are separate Speech capabilities.

